    <main style="padding: 20px;">
        <h2>Форма 1: Контактные данные</h2>
        
        <form action="https://httpbin.org/post" method="POST">
            <p>Фамилия: <input type="text" name="surname"></p>
            <p>Имя: <input type="text" name="firstname"></p>
            <p>Группа: <input type="text" name="group"></p>
            <p>Телефон: <input type="tel" name="phone"></p>
            <p>Email: <input type="email" name="email"></p>
            <p>Дата: <input type="date" name="date"></p>
            <button type="submit">Отправить</button>
        </form>

        <hr>

        <h2>Форма 2: Заказ</h2>
        
        <form action="https://httpbin.org/post" method="POST">
            <input type="hidden" name="id" value="1014">
            
            <p>Товар: <input type="text" name="product"></p>
            <p>Количество: <input type="number" name="count" value="1"></p>
            
            <p>Доставка:</p>
            <p><input type="radio" name="delivery" value="courier" checked> Курьер</p>
            <p><input type="radio" name="delivery" value="pickup"> Самовывоз</p>
            
            <p><input type="checkbox" name="agree" value="yes" checked> Согласен</p>
            
            <p>Дата: <input type="date" name="delivery_date"></p>
            <p>Пароль: <input type="password" name="pass"></p>
            
            <button type="submit">Заказать</button>
        </form>
    </main>
</body>
</html>
